<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Pesquisa</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário HTML – Pesquisa de Usuário</h1>
    </header>

    <main>
        <form action="">
            <fieldset>
                <legend>Informações de Contato</legend>

                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>

                <div class="item-formulario coluna2">
                    <label for="emaildousuario">E-mail:</label>
                    <input type="email" id="emaildousuario" name="emaildousuario" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>

                <div class="item-formulario coluna1">
                    <label for="navegador">Qual é o seu navegador favorito?</label>
                    <select name="navegador" id="navegador">
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="item-formulario coluna1">
                    <label for="pet">Você tem um bichinho de estimação em casa?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="item-formulario item-textarea">
                    <label for="feedback">Liste os lugares onde você morou.</label>
                    <textarea name="feedback" id="feedback" rows="4"
                      placeholder="Upata Estado Bolívar, Maracaibo Zulia, Araucária Paraná."></textarea>
                </div>
            </fieldset>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | WDD130 | Jonathan Carpio</p>
    </footer>
</body>

</html>
